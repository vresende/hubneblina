services:
  sandbox-pj-neblina-laravel-hub:
    container_name: sandbox-pj-neblina-laravel-hub
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    volumes:
      - ./:/var/www
      - ./docker/server_start.sh:/usr/local/bin/server_start.sh
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./storage:/var/www/storage
      - ./vendor:/var/www/vendor
    environment:
      APP_ENV: sandbox
      APP_DEBUG: true
      APP_URL: https://sandbox.grupomater.com.br/hub
      DB_CONNECTION: ${SANDBOX_DB_CONNECTION}
      DB_HOST: ${SANDBOX_DB_HOST}
      DB_PORT: ${SANDBOX_DB_PORT}
      DB_DATABASE: ${SANDBOX_DB_DATABASE}
      DB_USERNAME: ${SANDBOX_DB_USERNAME}
      DB_PASSWORD: ${SANDBOX_DB_PASSWORD}
      TZ: America/Sao_Paulo
    command: ["/bin/sh", "-c", "/bin/bash /usr/local/bin/server_start.sh"]
    networks:
      - sandbox-hub-network
      - traefik_proxy

    labels:
      traefik.enable: "true"
      traefik.http.routers.hub.rule: >
        Host(`sandbox.grupomater.com.br`) && PathPrefix(`/hub`)
      traefik.http.routers.hub.entrypoints: websecure
      traefik.http.routers.hub.tls.certresolver: letsencrypt
      traefik.http.routers.hub.middlewares: replace-hub
      traefik.http.services.hub.loadbalancer.server.port: "8081"
      traefik.http.middlewares.replace-hub.replacepathregex.regex: ^/hub(.*)
      traefik.http.middlewares.replace-hub.replacepathregex.replacement: /api$$1

networks:
  prod-hub-network:
    name: prod-hub-network
    driver: bridge
  traefik_proxy:
    external: true
