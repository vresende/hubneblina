services:
  sandbox-pj-neblina-laravel-hub:
    container_name: sandbox-pj-neblina-laravel-hub
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    volumes:
      - ./:/var/www
      - ./docker/server_start.sh:/usr/local/bin/server_start.sh
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./storage:/var/www/storage
      - ./vendor:/var/www/vendor
    environment:
      APP_ENV: sandbox
      APP_DEBUG: true
      APP_URL: https://sandbox.grupomater.com.br
      DB_CONNECTION: ${SANDBOX_DB_CONNECTION}
      DB_HOST: ${SANDBOX_DB_HOST}
      DB_PORT: ${SANDBOX_DB_PORT}
      DB_DATABASE: ${SANDBOX_DB_DATABASE}
      DB_USERNAME: ${SANDBOX_DB_USERNAME}
      DB_PASSWORD: ${SANDBOX_DB_PASSWORD}
      TZ: America/Sao_Paulo
    command: ["/bin/sh", "-c", "/bin/bash /usr/local/bin/server_start.sh"]
    networks:
      - sandbox-hub-network
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sandbox-hub.rule=Host(`sandbox.grupomater.com.br`) && PathPrefix(`/hub`)"
      - "traefik.http.routers.sandbox-hub.entrypoints=websecure"
      - "traefik.http.routers.sandbox-hub.tls.certresolver=letsencrypt"
      - "traefik.http.routers.sandbox-hub.middlewares=sandbox-strip-hub"
      - "traefik.http.services.sandbox-hub.loadbalancer.server.port=8181"
      - "traefik.http.middlewares.sandbox-strip-hub.stripPrefix.prefixes=/hub"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

networks:
  sandbox-hub-network:
    name: sandbox-hub-network
    driver: bridge
  traefik_proxy:
    external: true

